name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install numpy==2.5.2 opencv-python-headless==4.14.0.94
      - name: Existing analytics, recording, rendering and source tests
        working-directory: visioneye
        run: python -B -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/data.js
